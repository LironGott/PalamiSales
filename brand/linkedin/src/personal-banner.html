<!doctype html><html dir="rtl" lang="he"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../site/fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1584px;height:396px;overflow:hidden}
body{background:linear-gradient(270deg,#FEFEFC 0%,#FEFEFC 40%,#FBF1E2 100%);font-family:Assistant,sans-serif;position:relative}
.bar{position:absolute;inset:auto 0 0 0;height:22px;background:#08402A}
/* Right side kept for text; LinkedIn profile photo covers bottom-left on desktop (in LTR UI) / varies, so content sits right & center-right */
.txt{position:absolute;top:64px;right:80px;width:740px}
h1{font-family:Rubik,sans-serif;font-weight:800;font-size:64px;line-height:1.1;color:#08402A}
h1 span{color:#C37237}
p{font-size:28px;color:#2A3A32;margin-top:18px;font-weight:500}
.url{font-family:Rubik;font-weight:700;font-size:30px;color:#08402A;margin-top:22px;direction:ltr;unicode-bidi:isolate;display:inline-block}
.phones{position:absolute;left:150px;top:40px;display:flex;gap:26px;align-items:flex-start}
.ph{width:170px;height:350px;border:7px solid #08402A;border-radius:30px;overflow:hidden;background:#fff;box-shadow:0 18px 40px rgba(8,64,42,.18)}
.ph img{width:100%;display:block}
.ph.m{margin-top:-14px}
.ph.s{transform:rotate(-5deg);margin-top:20px}.ph.e{transform:rotate(5deg);margin-top:20px}
</style></head><body>
<div class="txt"><h1>כל פרטי הנסיעה <span>בכף ידך</span></h1>
<p>הסוכנות גוררת מסמכים, הנוסע מקבל הכל בטלפון.</p>
<div class="url">www.palami.io</div></div>
<div class="phones">
<div class="ph e"><img src="../../../site/img/t-docs.webp"></div>
<div class="ph m"><img src="../../../site/img/t-home-before.webp"></div>
<div class="ph s"><img src="../../../site/img/t-schedule.webp"></div>
</div>
<div class="bar"></div></body></html>
