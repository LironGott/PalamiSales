<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PALAMI · סוכן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Assistant:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* PALAMI agent theme (brand/tokens/theme-agent.css): professional, quiet, dense; green only for primary action and nav; status signals per BR-48..53.
   Layout: אפליקציית סוכן: תפריט קבוע מימין, סרגל עליון עם עזרה/טקסט גדול/תצוגה פשוטה, ותוכן; בטלפון התפריט עובר לסרגל תחתון */
:root{
  --bg:#f4f6f4; --surface:#ffffff; --surface-2:#eceeec; --ink:#16211c; --muted:#545d58; --line:#dee3df;
  --acc:#08402a; --acc-ink:#ffffff; --acc-soft:#e8f1ec;
  --ok:#33704f; --ok-fill:#5e9677; --ok-soft:#e6f0ea; --warn:#8a5f00; --warn-fill:#c28a0e; --warn-soft:#fbf1d6; --bad:#b91c3c; --bad-soft:#fce8ec; --info:#1d5fa8; --info-soft:#e4eef8;
  --shadow:0 1px 2px rgb(21 26 23 / .06),0 2px 8px rgb(21 26 23 / .06);
  --f-d:"Rubik","Assistant",Arial,sans-serif; --f-b:"Assistant","Rubik",Arial,sans-serif; --f-m:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --fs:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101512; --surface:#171d19; --surface-2:#1f2621; --ink:#e6ebe8; --muted:#9da8a1; --line:#2a322d;
  --acc:#74b590; --acc-ink:#021209; --acc-soft:#18291f; --ok:#7fbf9a; --ok-fill:#5e9677; --ok-soft:#16271e; --warn:#e6b54a; --warn-fill:#c28a0e; --warn-soft:#2e2610; --bad:#f27a8c; --bad-soft:#331820; --info:#7fb2e8; --info-soft:#132235;
  --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#101512; --surface:#171d19; --surface-2:#1f2621; --ink:#e6ebe8; --muted:#9da8a1; --line:#2a322d;
  --acc:#74b590; --acc-ink:#021209; --acc-soft:#18291f; --ok:#7fbf9a; --ok-fill:#5e9677; --ok-soft:#16271e; --warn:#e6b54a; --warn-fill:#c28a0e; --warn-soft:#2e2610; --bad:#f27a8c; --bad-soft:#331820; --info:#7fb2e8; --info-soft:#132235;
  --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b)}
#root{font-size:var(--fs);line-height:1.5;display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-inline-end:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.ws{font-family:var(--f-d);font-weight:700;font-size:1.05em;padding:2px 10px 14px;display:grid}
.ws small{font-family:var(--f-b);font-weight:400;color:var(--muted);font-size:.78em}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;color:var(--ink);background:none;border:0;font:inherit;cursor:pointer;text-align:start;width:100%}
.nav svg{width:20px;height:20px;color:var(--muted)}
.nav span.l{display:flex;gap:10px;align-items:center}
.nav[aria-current="page"]{background:var(--acc-soft);color:var(--acc);font-weight:700}
.nav[aria-current="page"] svg{color:var(--acc)}
.credit{margin-top:auto;padding:12px;border-radius:8px;background:var(--surface-2);font-size:.82em;display:grid;gap:2px}
.credit b{font-size:1.4em;font-family:var(--f-d)}
.main{min-width:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3;flex-wrap:wrap}
.bar .search{flex:1;min-width:180px;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 12px;min-height:42px;color:var(--muted)}
.bar .search input{border:0;background:none;font:inherit;color:var(--ink);flex:1;min-width:0;outline:none}
.bar .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 12px;min-height:46px;color:var(--muted);width:min(520px,100%)}
.search input{border:0;background:none;font:inherit;color:var(--ink);flex:1;min-width:0;outline:none}
.search:focus-within{outline:3px solid var(--acc);border-color:transparent}
.content{padding:22px 24px 60px;display:grid;gap:18px;align-content:start;max-width:1180px;width:100%;min-width:0}
.content>*{min-width:0}
h1,h2,h3{font-family:var(--f-d);margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:1.6em}h2{font-size:1.25em}h3{font-size:1.05em}
p{margin:0}
.muted{color:var(--muted)}.sm{font-size:.88em}.xs{font-size:.78em}
.mono{font-family:var(--f-m);direction:ltr;unicode-bidi:isolate}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}.nw{flex-wrap:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:8px;font:600 .92em var(--f-b);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.btn.ghost{background:var(--surface-2);border-color:transparent}
.btn.s{min-height:36px;padding:0 12px;font-size:.84em;border-radius:10px}
.btn.big{min-height:54px;font-size:1.02em;width:100%}
.btn svg,.nav svg{flex:none}
.btn:focus-visible,.nav:focus-visible,.tile:focus-visible,tr.click:focus-visible,.chip:focus-visible,.tog:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.78em;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--info-soft);color:var(--info)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:2px;text-align:start;font:inherit;color:inherit;cursor:pointer;position:relative}
.tile b{font-family:var(--f-d);font-size:2em;line-height:1.15}
.tile span{color:var(--muted);font-size:.86em}
.tile .go{position:absolute;top:12px;inset-inline-end:14px;font-size:.78em;color:var(--acc);font-weight:700}
.tile.hot{box-shadow:inset 0 3px 0 var(--bad)}
.tile.calm{box-shadow:inset 0 3px 0 var(--ok-fill)}
.tile.attn{box-shadow:inset 0 3px 0 var(--warn-fill)}
tr.sig-b>td:first-child{box-shadow:inset -3px 0 0 var(--bad)}
tr.sig-w>td:first-child{box-shadow:inset -3px 0 0 var(--warn-fill)}
.vk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ok-fill);flex:none;vertical-align:middle}
.vk::after{content:"";width:9px;height:5px;border:solid #fff;border-width:0 0 2.2px 2.2px;transform:translateY(-1px) rotate(-45deg)}
.ws img{height:20px;width:auto;margin-bottom:12px;display:block}
.agy{display:flex;gap:10px;align-items:center}
.agy>div{display:grid;min-width:0}
.agl{width:42px;height:42px;flex:none;border-radius:10px;box-shadow:0 0 0 1px var(--line)}
.agm{display:none}
.ubtn{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;font:inherit;color:inherit;text-align:start;cursor:pointer;padding:6px;margin:-6px;border-radius:10px}
.ubtn:hover{background:var(--surface-2)}
.ubtn:focus-visible,.umi:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ubtn .chev{margin-inline-start:auto;color:var(--muted);font-size:.8em}
.uav{display:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--acc-soft);color:var(--acc);font:700 .85em var(--f-d);cursor:pointer;flex:none}
.umenu{position:fixed;z-index:9;width:260px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgb(0 0 0 / .22);padding:6px;display:grid}
.umenu .uh{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;gap:1px}
.umi{display:flex;gap:10px;align-items:center;min-height:44px;padding:0 12px;border:0;background:none;border-radius:8px;font:inherit;color:inherit;text-align:start;cursor:pointer;width:100%}
.umi:hover{background:var(--surface-2)}
.umi.out{color:var(--bad)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg)}
.login .card{width:min(420px,100%);padding:28px;gap:14px}
.login label{display:grid;gap:4px;font-size:.88em;font-weight:600}
.login .chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:.9em}
.login .chk input{width:20px;height:20px;accent-color:var(--acc);margin-top:2px;flex:none}
.tile .sh{display:none}
.mcards{display:none}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;cursor:pointer;text-align:start}
.mcard.sig-b{box-shadow:inset -3px 0 0 var(--bad)}.mcard.sig-w{box-shadow:inset -3px 0 0 var(--warn-fill)}
.mcard .mc-r{display:grid;gap:4px;justify-items:end}
.mlist{background:var(--surface-2);border-radius:10px;padding:2px 12px}
.agm svg{width:34px;height:34px;border-radius:8px;box-shadow:0 0 0 1px var(--line)}
.tile:hover{border-color:var(--acc)}
.drop{border:2px dashed color-mix(in srgb,var(--acc) 45%,var(--line));border-radius:10px;padding:18px;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;text-align:center;background:color-mix(in srgb,var(--acc-soft) 50%,transparent)}
.drop.over{background:var(--acc-soft);border-color:var(--acc)}
.drop svg{width:30px;height:30px;color:var(--acc)}
.drop b{font-family:var(--f-d);font-size:1.05em}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92em}
th,td{padding:12px 14px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:500;color:var(--muted);font-size:.86em;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.bar6{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;width:92px}
.bar6 i{display:block;height:100%;background:var(--ok)}.bar6 i.w{background:var(--warn)}.bar6 i.b{background:var(--bad)}
.grp{background:var(--surface-2);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-d);font-weight:600;flex-wrap:wrap}
.item{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.item>div:first-child{flex:1 1 260px;min-width:0}
.tid{font:600 .78em var(--f-m);direction:ltr;unicode-bidi:isolate;background:var(--acc-soft);color:var(--acc);border-radius:6px;padding:2px 7px;white-space:nowrap}
.grp .gt{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.grp .gt .btn{font-family:var(--f-d)}
.item:last-child{border-bottom:0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fi{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.fi:last-child{border-bottom:0}
.st{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.st svg{width:17px;height:17px}
.st.ok{background:var(--ok-soft);color:var(--ok)}.st.w{background:var(--warn-soft);color:var(--warn)}.st.b{background:var(--bad-soft);color:var(--bad)}.st.p{background:var(--acc-soft);color:var(--acc)}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.snip{background:var(--surface-2);border-radius:10px;padding:12px;font-family:var(--f-m);font-size:.84em;direction:ltr;text-align:left;color:var(--muted)}
.snip mark{background:var(--warn-soft);color:var(--ink);outline:2px solid var(--warn);border-radius:3px;padding:0 3px}
input.inp{min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;width:100%}
.tbl td.nw,.tbl td.mono{white-space:nowrap}
.dt{white-space:nowrap;font-variant-numeric:tabular-nums}
.dtr{unicode-bidi:isolate;display:inline-block}
button.lnk{border:0;background:none;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;padding:0;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
button.lnk:hover{text-decoration-color:var(--acc)}
button.mp{border:0;cursor:pointer;font-family:var(--f-b)}
tr.mdet>td{background:var(--surface-2);padding:6px 16px}
.mi{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mi:last-child{border-bottom:0}
.mi>div:first-child{flex:1 1 280px;min-width:0}
textarea.inp{min-height:110px;padding:10px 12px;resize:vertical;line-height:1.5}
.pkrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
select.inp{min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:0 10px;font:inherit;width:100%}
select.inp:focus,input.inp:focus{outline:3px solid var(--acc);border-color:transparent}
.cmp{display:grid;grid-template-columns:130px 1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cmp>div{padding:11px 14px;border-bottom:1px solid var(--line)}
.cmp .h{background:var(--surface-2);font-weight:600;font-size:.86em}
.cmp label{display:flex;gap:8px;align-items:center;cursor:pointer}
.cmp input{width:18px;height:18px;accent-color:var(--acc)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;font:inherit;padding:10px 14px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--acc);border-color:var(--acc);font-weight:700}
.check{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.tog{width:48px;height:28px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}
.tog::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:inset .15s}
.tog[aria-checked="true"]{background:var(--acc)}
.tog[aria-checked="true"]::after{inset-inline-start:23px}
.tog.lock{opacity:.55}
select.sel{min-height:38px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;padding:0 8px}
.chat{display:grid;grid-template-columns:300px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:520px}
.conv{border-inline-end:1px solid var(--line)}
.conv button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;color:inherit;cursor:pointer;text-align:start;width:100%}
.conv button[aria-current="true"]{background:var(--acc-soft)}
.thread{display:grid;grid-template-rows:auto 1fr auto;min-width:0}
.conv button.cv{grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:10px}
.cav{width:40px;height:40px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font:700 .9em var(--f-d)}
.cbody{display:grid;gap:1px;min-width:0}
.cl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:.88em}
.cl.un{color:var(--ink);font-weight:700}
.udot{width:10px;height:10px;border-radius:50%;background:var(--bad);display:block}
.th-h{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.th-h>div{flex:1;min-width:0}
.th-back{display:none}
.msgs{padding:16px;display:flex;flex-direction:column;gap:10px;justify-content:flex-end;overflow-y:auto;max-height:420px}
.msg{max-width:72%;padding:10px 13px;border-radius:14px;display:grid;gap:3px}
.msg.them{align-self:flex-start;background:var(--surface-2)}
.msg.me{align-self:flex-end;background:var(--acc-soft)}
.msg small{font-size:.75em;color:var(--muted)}
.composer{display:grid;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.overlay,.toast{direction:rtl;text-align:right}
.modal.pub{max-width:600px;gap:16px;padding:0;overflow:hidden}
.pub .mh{padding:22px 24px 0;display:grid;gap:4px}
.pub .mb{padding:0 24px;display:grid;gap:14px}
.pub .mf{display:flex;gap:10px;justify-content:flex-start;align-items:center;padding:14px 24px;border-top:1px solid var(--line);background:var(--surface-2)}
.pub .mf .sp{flex:1}
.sumg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sumg div{background:var(--surface-2);border-radius:8px;padding:10px 12px;display:grid;gap:2px}
.sumg b{font:700 1.45em var(--f-d);line-height:1.15}
.sumg span{font-size:.8em;color:var(--muted)}
.see{display:flex;flex-wrap:wrap;gap:6px}
.chan{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;border:0;padding:0;margin:0}
.chan legend{font-size:.88em;font-weight:600;margin-bottom:6px;padding:0}
.chan label{position:relative;border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:2px;cursor:pointer;background:var(--surface)}
.chan input{position:absolute;opacity:0;pointer-events:none}
.chan label:has(input:checked){border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft);background:var(--acc-soft)}
.chan label:has(input:focus-visible){outline:3px solid var(--acc);outline-offset:2px}
.chan label b::before{content:'';display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);margin-inline-end:8px;vertical-align:-2px}
.chan label:has(input:checked) b::before{border:4px solid var(--acc)}
@media (max-width:560px){.sumg{grid-template-columns:1fr 1fr 1fr}.chan{grid-template-columns:1fr}}
.overlay{position:fixed;inset:0;background:rgb(10 16 24 / .45);display:grid;place-items:center;padding:16px;z-index:10}
.modal{background:var(--surface);border-radius:18px;max-width:560px;width:100%;padding:24px;display:grid;gap:14px;box-shadow:0 20px 60px rgb(0 0 0 / .3)}
.banner{border-radius:8px;padding:12px 14px;display:grid;gap:4px;font-size:.92em}
.banner.ok{background:var(--ok-soft)}.banner.warn{background:var(--warn-soft)}.banner.info{background:var(--info-soft)}
.toast{position:fixed;bottom:24px;inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 30px rgb(0 0 0 / .3);z-index:20;max-width:calc(100% - 32px)}
.help{background:var(--acc-soft);border-radius:14px;padding:12px 16px;display:flex;gap:10px;align-items:flex-start}

var LEGAL={"privacy":{"t":"מדיניות פרטיות","h":"<p>עדכון אחרון: <span class=\"fill\">1.10.2026<\/span><\/p><div class=\"sum\"><p><b>בקצרה<\/b><\/p><ul><li>את פרטי הנסיעה שלך מנהלת <span class=\"fill\">מסעות הדרים<\/span>. PALAMI מפעילה את האפליקציה בשבילה.<\/li><li>המידע משמש רק לנסיעה שלך: לו״ז, מסמכים, עדכונים וקשר עם הסוכנות. הוא לא נמכר.<\/li><li>אפשר לעיין במידע, לתקן אותו או לבקש למחוק אותו. פשוט כותבים לסוכן.<\/li><\/ul><\/div><h3>1. מי מנהל את המידע<\/h3><p><span class=\"fill\">מסעות הדרים<\/span> (<span class=\"fill\">ח.פ. 51-555555-5<\/span>, <span class=\"fill\">רחוב הדוגמה 1, תל אביב<\/span>), להלן \"הסוכנות\", אחראית למידע עליך. לפי חוק הגנת הפרטיות היא \"בעלת השליטה\" במאגר.<\/p><p>את האפליקציה מפעילה <span class=\"fill\">PALAMI בע״מ<\/span> (<span class=\"fill\">ח.פ. 51-666666-6<\/span>), להלן \"PALAMI\". PALAMI מעבדת את המידע רק בשביל הסוכנות, לפי ההוראות שלה ולפי הסכם בכתב ביניהן.<\/p><p><b>פניות בנושא פרטיות:<\/b> <span class=\"fill\">privacy@hadarim.co.il<\/span> · <span class=\"fill\">03-555-0142<\/span><\/p><p><span class=\"fill\">ממונה הגנת פרטיות, אם מונה<\/span><\/p><h3>2. איזה מידע נאסף<\/h3><ul><li><b>פרטי קשר:<\/b> שם, נייד ואימייל.<\/li><li><b>פרטי הנסיעה:<\/b> יעדים, תאריכים, טיסות, לינה, רכב, לו״ז, ושמות הנוסעים בנסיעה.<\/li><li><b>מסמכים:<\/b> כרטיסים, שוברים ופוליסות ביטוח שהסוכנות העלתה או שהעלית בעצמך. חלקם כוללים פרטים אישיים, למשל מספר דרכון.<\/li><li><b>מה שכתבת או הוספת:<\/b> הודעות לסוכנות, פריטים ברשימת האריזה ופעילויות שהוספת ללו״ז.<\/li><li><b>מידע טכני:<\/b> סוג המכשיר והדפדפן, מועדי כניסה, וההגדרות שבחרת (למשל טקסט גדול וערוצי עדכון).<\/li><\/ul><p><b>מה לא נאסף:<\/b> מיקום מה־GPS, אנשי הקשר בטלפון ופרטי תשלום.<\/p><h3>3. למה המידע משמש<\/h3><ul><li>להציג לך את הנסיעה: לו״ז, מסמכים, מידע שימושי ומסך חירום.<\/li><li>לשלוח לך תזכורות ועדכונים בערוצים שבחרת: באפליקציה, ב־WhatsApp או באימייל.<\/li><li>לאפשר קשר עם הסוכנות, גם בחירום.<\/li><li>לאבטחת החשבון, לתמיכה ולתיקון תקלות.<\/li><li><b>הצעות מהסוכנות:<\/b> רק אם הסכמת לקבל אותן. כל הודעה כזו מסומנת \"פרסומת\", ואפשר להפסיק בכל רגע.<\/li><\/ul><p>המידע לא נמכר, ולא משמש לפרסום של אף גורם אחר.<\/p><h3>4. האם חובה למסור את המידע<\/h3><p>אין חובה לפי חוק. עם זאת, בלי נייד או אימייל לא נוכל לשלוח לך את הנסיעה ולתת לך גישה לאפליקציה. בלי המסמכים, הנסיעה לא תופיע במלואה.<\/p><h3>5. מי רואה את המידע<\/h3><ul><li><b>הסוכנות<\/b> והסוכן שמטפל בנסיעה שלך.<\/li><li><b>הנוסעים האחרים בנסיעה:<\/b> לפי הגדרת השיתוף שהסוכנות קבעה, ולפי מה שבחרת כשהעלית מסמך (\"רק אני\", כל הנוסעים, או נוסעים שבחרת).<\/li><li><b>PALAMI וספקים שעובדים בשבילה:<\/b> אחסון בענן, שליחת הודעות (WhatsApp, אימייל ו־SMS) וקריאת מסמכים בעזרת בינה מלאכותית. הם מקבלים רק את מה שנדרש לשירות, ומחויבים לסודיות. <b>המסמכים שלך לא משמשים לאימון מודלים.<\/b><\/li><li><b>רשויות:<\/b> רק אם החוק מחייב.<\/li><\/ul><h3>6. מידע שנשמר מחוץ לישראל<\/h3><p>חלק מהספקים שומרים מידע בשרתים מחוץ לישראל. ההעברה נעשית לפי תקנות הגנת הפרטיות (העברת מידע אל מאגרי מידע שמחוץ לגבולות המדינה), התשס״א-2001.<\/p><h3>7. כמה זמן המידע נשמר<\/h3><p>הנסיעה זמינה לך באפליקציה <span class=\"fill\">12 חודשים<\/span> אחרי החזרה. לאחר מכן פרטי הנסיעה, המסמכים והפרטים האישיים נמחקים, וגם מהגיבויים תוך 30 יום. נשארים רק מספרים לסטטיסטיקה, בלי פרטים מזהים.<\/p><p>כמה דברים נשמרים יותר זמן, כי החוק מחייב או כי צריך אותם להגנה משפטית:<\/p><ul><li>רישום הכניסות והפעולות במערכת: 24 חודשים, לצורכי אבטחת מידע.<\/li><li>התיעוד שראית את התנאים ואת מדיניות הפרטיות: עד 7 שנים מסיום השימוש.<\/li><\/ul><h3>8. אבטחת מידע<\/h3><p>המידע מוצפן בהעברה ובאחסון. הגישה אליו לפי הרשאות, וכל פעולה מתועדת. כניסה ממכשיר חדש דורשת סיסמה וקוד חד־פעמי לנייד. אין אבטחה מושלמת. אם יקרה אירוע אבטחה חמור, נפעל לפי החוק ונודיע לרשות להגנת הפרטיות.<\/p><h3>9. הזכויות שלך<\/h3><ul><li><b>לעיין<\/b> במידע עליך (סעיף 13 לחוק הגנת הפרטיות).<\/li><li><b>לבקש תיקון או מחיקה<\/b> של מידע שאינו נכון, שלם, ברור או מעודכן (סעיף 14 לחוק).<\/li><li><b>להפסיק לקבל הצעות<\/b> בכל רגע: בהגדרות האפליקציה, בקישור שבכל הודעה, או בפנייה לסוכנות.<\/li><\/ul><p><b>איך:<\/b> כותבים לסוכן בצ'אט באפליקציה, או ל־<span class=\"fill\">privacy@hadarim.co.il<\/span>. נענה תוך 30 יום. אם הבקשה לא טופלה, אפשר לפנות לרשות להגנת הפרטיות.<\/p><h3>10. ילדים<\/h3><p>ילד בלי טלפון לא נרשם בעצמו. המסמכים וההתראות שלו מגיעים למבוגר מהנסיעה שהסוכנות שייכה אליו.<\/p><h3>11. מידע שנשמר בטלפון<\/h3><p>כדי שהנסיעה תהיה זמינה גם בלי אינטרנט, האפליקציה שומרת את פרטיה בטלפון. משתמשים רק בעוגיות שנחוצות לפעולת האפליקציה, כמו שמירת הכניסה וההגדרות. אין עוגיות פרסום או מעקב.<\/p><h3>12. שינויים במדיניות<\/h3><p>כשנעדכן את המדיניות, תאריך העדכון בראש העמוד ישתנה. על שינוי מהותי נודיע באפליקציה.<\/p>"},"terms":{"t":"תנאי שימוש","h":"<p>עדכון אחרון: <span class=\"fill\">1.10.2026<\/span><\/p><div class=\"sum\"><p><b>בקצרה<\/b><\/p><ul><li>PALAMI היא אפליקציה שהסוכנות שלך נותנת לך, כדי שכל פרטי הנסיעה יהיו במקום אחד. השימוש בה חינם.<\/li><li>את הנסיעה הזמנת דרך הסוכנות. על מחירים, ביטולים ושינויים מדברים איתה.<\/li><li>כדאי לבדוק זמנים חשובים, כמו שעת טיסה, גם מול החברה שמפעילה את השירות.<\/li><\/ul><\/div><h3>1. מה זה PALAMI<\/h3><p>PALAMI היא אפליקציה לנוסעים שמרכזת את פרטי הנסיעה: לו״ז, מסמכים, תזכורות, מידע שימושי ומסך חירום. <span class=\"fill\">מסעות הדרים<\/span>, להלן \"הסוכנות\", נותנת לך את האפליקציה כחלק מהשירות שלה. <span class=\"fill\">PALAMI בע״מ<\/span>, להלן \"PALAMI\", מפעילה את האפליקציה בשביל הסוכנות.<\/p><p>PALAMI אינה סוכנות נסיעות ואינה צד להזמנה שלך. ההתקשרות לגבי הנסיעה עצמה, כמו מחירים, תשלומים, ביטולים ושינויים, היא מול הסוכנות ומול ספקי השירות: חברות תעופה, מלונות, חברות השכרה וכדומה.<\/p><p>השימוש באפליקציה מהווה הסכמה לתנאים האלה. התנאים כתובים בלשון זכר מטעמי נוחות, ומיועדים לכל המגדרים.<\/p><h3>2. השימוש באפליקציה<\/h3><ul><li>השימוש חינם, ומיועד לשימוש אישי בנסיעה שלך.<\/li><li>מי שמתחת לגיל 18 משתמש באפליקציה בהסכמת הורה.<\/li><li>כדי להיכנס צריך נייד או אימייל שהסוכנות שייכה לנסיעה, וסיסמה שבחרת.<\/li><\/ul><h3>3. החשבון שלך<\/h3><ul><li>שמור את הסיסמה לעצמך, ואל תמסור אותה לאחרים.<\/li><li>אם נראה לך שמישהו אחר נכנס לחשבון שלך, הודע לסוכנות. הסוכנות יכולה לנתק את כל המכשירים מהחשבון.<\/li><\/ul><h3>4. המידע באפליקציה<\/h3><ul><li>המידע מגיע מהמסמכים שהסוכנות העלתה ומהמסמכים שהעלית בעצמך. הסוכנות בודקת ומאשרת את פרטי הנסיעה לפני שהם נשלחים אליך.<\/li><li>ספקים משנים לפעמים זמנים ופרטים, ולא תמיד מעדכנים מיד. לפני יציאה לשדה או לאירוע חשוב, כדאי לבדוק את הפרטים גם מול הספק, למשל באתר חברת התעופה.<\/li><li>האפליקציה לא מחליפה את המסמך המקורי. המסמכים המקוריים שמורים בה, ואפשר להציג אותם בכל רגע.<\/li><li>מידע כללי, כמו מזג אוויר ושערי מטבע, מגיע ממקורות חיצוניים, ומוצג לנוחות בלבד.<\/li><\/ul><h3>5. חירום<\/h3><p>מסך החירום עוזר להגיע מהר למספרים הנכונים. <b>במצב של סכנה, חייגו מיד למספר החירום המקומי.<\/b> המספרים נבדקים מדי פעם, אבל הם עלולים להשתנות.<\/p><h3>6. תזכורות והתראות<\/h3><p>אנחנו משתדלים לשלוח כל תזכורת בזמן, אבל הן תלויות ברשת, במכשיר ובספקי ההודעות. לכן אין להסתמך רק עליהן.<\/p><h3>7. מסמכים ותוכן שאתה מוסיף<\/h3><ul><li>אתה אחראי לכך שמותר לך להעלות את המסמכים והתוכן שאתה מוסיף.<\/li><li>אסור להעלות תוכן פוגעני, מפר זכויות או לא חוקי.<\/li><li>מסמך שבחרת לשתף, יראו הנוסעים שבחרת. הסוכנות רואה כל מה שהועלה לנסיעה.<\/li><li>אתה מרשה ל־PALAMI ולסוכנות לעבד את מה שהעלית, רק כדי לתת לך את השירות. המסמכים שלך נשארים שלך.<\/li><\/ul><h3>8. מה אסור<\/h3><p>אסור לנסות לגשת למידע של אחרים, לפרוץ למערכת או לשבש אותה, להעתיק את האפליקציה או חלקים ממנה, או להשתמש בה למטרה מסחרית.<\/p><h3>9. זמינות<\/h3><p>לפעמים תהיה תקלה או עבודת תחזוקה. פרטי הנסיעה נשמרים בטלפון, ולכן רובם זמינים גם בלי אינטרנט. הנסיעה נשארת זמינה באפליקציה <span class=\"fill\">12 חודשים<\/span> אחרי החזרה.<\/p><h3>10. אחריות<\/h3><p>האפליקציה ניתנת כמו שהיא. PALAMI אינה אחראית לשינויים, לעיכובים או לביטולים של ספקי הנסיעה, ולא לנזק שנגרם בגלל הסתמכות על פרט שלא נבדק מול הספק. אין בתנאים האלה כדי להגביל אחריות שהחוק לא מאפשר להגביל, ואין בהם כדי לפגוע בזכויות שלך כצרכן.<\/p><h3>11. קניין רוחני<\/h3><p>האפליקציה, העיצוב, הסימנים והבונה של PALAMI שייכים ל־PALAMI. הלוגו והשם של הסוכנות שייכים לסוכנות.<\/p><h3>12. פרטיות<\/h3><p>איך משתמשים במידע עליך מוסבר ב<span class=\"fill\">מדיניות הפרטיות<\/span>.<\/p><h3>13. הפסקת שימוש<\/h3><p>אפשר להפסיק להשתמש באפליקציה בכל רגע, ולבקש מהסוכנות למחוק את המידע. PALAMI רשאית לחסום גישה במקרה של שימוש לרעה.<\/p><h3>14. שינויים בתנאים<\/h3><p>כשנעדכן את התנאים, תאריך העדכון בראש העמוד ישתנה. על שינוי מהותי נודיע באפליקציה.<\/p><h3>15. דין ושיפוט<\/h3><p>על התנאים האלה חל הדין הישראלי. סכסוך יידון בבית המשפט המוסמך בישראל.<\/p><h3>16. יצירת קשר<\/h3><ul><li>בנושא הנסיעה: <span class=\"fill\">מסעות הדרים<\/span> · <span class=\"fill\">03-555-0142<\/span> · <span class=\"fill\">office@hadarim.co.il<\/span><\/li><li>בנושא האפליקציה: PALAMI · <span class=\"fill\">hello@palami.io<\/span><\/li><\/ul>"},"access":{"t":"הצהרת נגישות","h":"<p>עדכון אחרון: <span class=\"fill\">1.10.2026<\/span><\/p><p>PALAMI ו־<span class=\"fill\">מסעות הדרים<\/span> רוצות שכל נוסע יוכל להשתמש באפליקציה בקלות, כולל אנשים עם מוגבלות ונוסעים מבוגרים. השקענו בזה מהיום הראשון, ונמשיך לשפר.<\/p><h3>רמת הנגישות<\/h3><p>האפליקציה נבנתה לפי תקנות שוויון זכויות לאנשים עם מוגבלות (התאמות נגישות לשירות), התשע״ג-2013, ולפי התקן הישראלי ת״י 5568, המבוסס על הנחיות WCAG, ברמה AA. היעד שלנו הוא WCAG 2.2 ברמה AA.<\/p><p>הבדיקה האחרונה: <span class=\"fill\">9.2026<\/span>, על ידי <span class=\"fill\">בודק נגישות מוסמך<\/span>.<\/p><h3>מה עשינו<\/h3><ul><li>מבנה ברור מימין לשמאל, עם כותרות ותוויות שקוראי מסך מזהים.<\/li><li>אפשר להפעיל הכול עם מקלדת ועם קורא מסך: VoiceOver ב־iPhone, TalkBack ב־Android ו־NVDA במחשב.<\/li><li>\"טקסט גדול\" בהגדרות. גם הגדלה בדפדפן עובדת בלי שהתוכן נחתך.<\/li><li>ניגודיות צבעים לפי התקן. מידע לא מועבר רק בצבע: יש גם סימן, טקסט או אייקון.<\/li><li>כפתורים גדולים, שקל ללחוץ עליהם במגע.<\/li><li>אין תוכן מהבהב ואין סאונד שמתחיל לבד. מי שביקש מהמכשיר להפחית תנועה, יקבל פחות אנימציות.<\/li><li>טקסט חלופי לתמונות ולאייקונים. בטפסים יש תוויות, והודעות השגיאה ברורות.<\/li><li>הודעות קצרות, כמו \"בטל\", נשארות על המסך מספיק זמן, וקורא המסך מקריא אותן.<\/li><li>פרטי הנסיעה נשמרים בטלפון, וזמינים גם בלי אינטרנט.<\/li><\/ul><h3>מה עוד לא נגיש<\/h3><ul><li><b>מסמכים מהספקים<\/b>, כמו כרטיסי טיסה, שוברים ופוליסות, מוצגים כפי שהספק הפיק אותם, וייתכן שאינם נגישים. הפרטים החשובים שבהם מופיעים גם כטקסט נגיש באפליקציה. צריכים את המסמך בפורמט אחר? כתבו לסוכן.<\/li><li><b>אתרים ואפליקציות חיצוניים<\/b> שאליהם מקשרים, כמו אתר חברת התעופה ואפליקציות ניווט, נמצאים באחריות בעליהם.<\/li><li><span class=\"fill\">ליקויים שנמצאו בבדיקה, אם יש, ומתי יתוקנו<\/span><\/li><\/ul><h3>מכשירים ודפדפנים<\/h3><p>האפליקציה נבדקה ב־Safari ב־iPhone, ב־Chrome ב־Android, וב־Chrome, Edge ו־Safari במחשב, בשתי הגרסאות האחרונות של כל אחד.<\/p><h3>נתקלתם בבעיה?<\/h3><p>נשמח לעזור, ולתקן.<\/p><ul><li><b>רכז הנגישות של הסוכנות:<\/b> <span class=\"fill\">רונית לוי<\/span> · <span class=\"fill\">03-555-0142<\/span> · <span class=\"fill\">access@hadarim.co.il<\/span><\/li><li><b>נגישות האפליקציה (PALAMI):<\/b> <span class=\"fill\">access@palami.io<\/span><\/li><\/ul><p>כדי שנוכל לעזור מהר, כדאי לכתוב מה ניסיתם לעשות ובאיזה מסך, באיזה מכשיר ודפדפן, ואיזו טכנולוגיה מסייעת הפעלתם, אם הפעלתם. נחזור אליכם תוך <span class=\"fill\">5<\/span> ימי עבודה.<\/p><h3>הסדרי נגישות בסוכנות<\/h3><p><span class=\"fill\">כתובת הסוכנות, כניסה נגישה, חניה נגישה ושעות קבלת קהל. אם אין קבלת קהל, למשל: \"קבלת קהל בתיאום מראש בלבד.\"<\/span><\/p>"}};

   +(TRIPS[k].st!=='draft'?'<span class="xs muted">הנסיעה כבר פורסמה. נייד חדש יקבל קישור, והנייד הקודם כבר לא ישמש לכניסה.</span>':'')
   +'<div class="row" style="justify-content:flex-start;border-top:1px solid var(--line);padding-top:14px"><button class="btn pri" data-act="saveeditpax" data-k="'+k+'" data-i="'+i+'">שמירה</button><button class="btn ghost" data-act="close">ביטול</button></div></div>';
  document.body.appendChild(o);o.addEventListener('click',function(e){if(e.target===o)closeModal();});var f=document.getElementById(!ch&&!p[2]?'ep-ph':'ep-fn');if(f)f.focus();}
function openReport(){closeModal();var tk=S.view==='trip'&&S.trip?TRIPS[S.trip]:null;var o=document.createElement('div');o.className='overlay';o.id='modal';
  o.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="rp" style="max-width:600px"><h2 id="rp">דיווח על תקלה</h2><span class="sm muted">הקריאה מגיעה ישר לצוות PALAMI. נעדכן אותך בפעמון ובמייל.</span>'

   +'<div class="row" style="justify-content:flex-start;border-top:1px solid var(--line);padding-top:14px"><button class="btn pri" data-act="sendreport">שליחה</button><button class="btn ghost" data-act="close">ביטול</button></div></div>';
  document.body.appendChild(o);o.addEventListener('click',function(e){if(e.target===o)closeModal();});document.getElementById('rp-t').focus();}
function closeModal(){var m=document.getElementById('modal');if(m)m.remove();}
document.addEventListener('input',function(e){if(e.target&&e.target.id==='postv'){var pp=document.getElementById('postprev');if(pp)pp.textContent=postPrev(e.target.value);}});
render();
