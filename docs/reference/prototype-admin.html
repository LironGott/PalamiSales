function parseCSV(txt){return txt.split(/\r?\n/).map(function(l){return l.split(/[,;\t]/).map(function(c){return c.trim().replace(/^"|"$/g,'');});}).filter(function(c){return c.length>=3&&c[0]&&!/שם|name/i.test(c[0]);}).map(function(c){return {name:c[0],email:c[1]||'',phone:c[2]||'',role:c[3]||'סוכן'};});}
