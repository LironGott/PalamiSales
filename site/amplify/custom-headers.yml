# Paste into Amplify console: Hosting > Custom headers > Edit.
customHeaders:
  - pattern: '**'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=()'
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self' https://formspree.io; form-action 'self' https://formspree.io; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
  - pattern: '/fonts/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '/img/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=604800'
  - pattern: '/css/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=3600'
  - pattern: '/js/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=3600'
